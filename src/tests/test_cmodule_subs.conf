[instance_test_module]
module=test_module
test_method=test_anything
senders=instance_perl_check

[instance_dummy]
module=dummy
dummy_no_generation=no
dummy_max_generated=1

[instance_perl5_subs]
module=perl5
senders=instance_dummy
perl5_file=test_cmodule_subs.pl
perl5_process_sub=sub_process
perl5_config_sub=sub_config
perl5_worker_fanout=yes
perl5_do_include_build_directories=yes

[instance_perl5_subs[sub_a]]
sub_name=sub_a

[instance_perl5_subs[sub_b]]
sub_name=sub_b

[instance_perl_check]
module=perl5
senders=instance_perl5_subs
perl5_file=test_cmodule_subs.pl
perl5_process_sub=check_process
perl5_config_sub=check_config
perl5_do_include_build_directories=yes
sub_names=sub_a,sub_b
