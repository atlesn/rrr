[instance_test_module]
module=test_module
senders=instance_perl5
topic_filter=gpio-ok
test_method=test_anything

[instance_gpio]
module=gpio
senders=instance_perl5
topic_filter=gpio-command
gpio_chip=/dev/gpiochip2

[instance_perl5]
module=perl5
duplicate=yes
perl5_file=test_gpio.pl
perl5_config_sub=config
perl5_source_interval_ms=100
perl5_source_sub=source
perl5_do_include_build_directories=yes
gpio_chip_debugfs=/sys/kernel/debug/gpio-mockup/gpiochip2
