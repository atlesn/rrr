[instance_test_module]
module=test_module
test_method=test_anything
senders=instance_buffer_output

[instance_buffer_output]
module=buffer
senders=instance_perl5_server
topic_filter=rrr/success

[instance_msgdb_put]
module=msgdb
msgdb_directory=/tmp/rrr-test-httpclient-put
msgdb_socket=/tmp/rrr-test-httpclient-put.sock

[instance_perl5_generator]
module=perl5
senders=instance_httpclient
duplicate=yes
perl5_file=test_httpclient_put_generator.pl
perl5_source_sub=source
perl5_process_sub=process
perl5_source_interval_ms=10
perl5_do_include_build_directories=yes

[instance_httpclient]
module=httpclient
senders=instance_perl5_generator
duplicate=yes
http_server=localhost
http_port=8001
http_endpoint_from_topic=yes
http_receive_json_data=yes
http_method=put
http_msgdb_socket=/tmp/rrr-test-httpclient-put.sock
http_msgdb_poll_interval_s=3
http_msgdb_topic_priority=prio/#
http_silent_put_error_limit_s=1

#####

[instance_httpserver]
module=httpserver
senders=instance_perl5_server
duplicate=yes
http_server_port_plain=8001
http_server_allow_empty_messages=yes
http_server_get_response_from_senders=yes
http_server_topic_format=request

[instance_perl5_server]
module=perl5
senders=instance_httpserver
topic_filter=httpserver/request/+/PUT/localhost:8001/#
duplicate=yes
perl5_file=test_httpclient_put_server.pl
perl5_source_sub=source
perl5_process_sub=process
perl5_source_interval_ms=500
perl5_do_include_build_directories=yes

