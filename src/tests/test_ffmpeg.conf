[instance_test_module]
module=test_module
topic_filter=success
test_method=test_anything
senders=instance_perl5

[instance_ffmpeg]
module=ffmpeg
ffmpeg_output_directory=/tmp
ffmpeg_filename_format=timestamp
ffmpeg_duration_s=2
ffmpeg_rounds=2
ffmpeg_filter_scale=1920x1080
ffmpeg_report_messages=yes

[instance_perl5]
module=perl5
senders=instance_ffmpeg
perl5_file=test_ffmpeg.pl
perl5_process_sub=process
perl5_do_include_build_directories=yes
