# This test works also when NGHTTP2 support is not built,
# falls back to HTTP/1.1

[instance_test_module]
module=test_module
topic_filter=success
test_method=test_anything
senders=instance_perl5_client

[instance_perl5_client]
module=perl5
senders=instance_httpclient
duplicate=yes
perl5_file=test_http2_request.pl
perl5_source_sub=source_client
perl5_process_sub=process_client
perl5_do_include_build_directories=yes

# By using TLS, HTTP2 will be negotiated using ALPN
[instance_httpclient]
module=httpclient
senders=instance_perl5_client
topic_filter=request
http_server=localhost
http_port=4433
http_transport_type=tls
#http_port=8883
#http_transport_type=plain
http_plain_http2=yes
http_message_timeout_ms=2000
http_drop_on_error=yes
http_tls_ca_file=../../misc/ssl/rootca/goliathdns.no.crt
http_endpoint_tag=http_endpoint
http_method_tag=http_method
http_body_tag=http_body
http_endpoint_tag_force=yes
http_method_tag_force=yes
http_receive_structured=yes
http_receive_part_data=yes

[instance_httpserver]
module=httpserver
senders=instance_perl5_server
http_server_port_plain=8883
http_server_port_tls=4433
http_server_transport_type=tls,plain
http_server_tls_certificate_file=../../misc/ssl/rrr.crt
http_server_tls_key_file=../../misc/ssl/rrr.key
# This parameter is documented to be implied
# http_server_receive_full_request=yes
http_server_get_response_from_senders=yes
http_server_allow_empty_messages=yes

[instance_perl5_server]
module=perl5
senders=instance_httpserver
perl5_file=test_http2_request.pl
perl5_process_sub=process_server
perl5_do_include_build_directories=yes
