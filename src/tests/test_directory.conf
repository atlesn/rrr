[instance_test_module]
module=test_module
test_method=test_anything
senders=instance_buffer

[instance_buffer]
module=buffer
senders=instance_perl5

[instance_directory]
module=directory
directory_directory=/tmp/////
directory_prefix=rrr-test-data.tmp.__test_dir
directory_probe_interval_s=1

[instance_perl5]
module=perl5
senders=instance_directory
perl5_file=test_directory.pl
perl5_process_sub=process
perl5_do_include_build_directories=yes
